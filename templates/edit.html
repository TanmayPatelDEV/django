<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Record</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 400px; padding: 20px; border: 1px solid #ddd; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; color: white; margin-top: 10px; display: inline-block; }
        .btn-save { background-color: #ffc107; color: black; border: none; cursor: pointer; font-size: 16px;}
        .btn-cancel { background-color: #6c757d; }
    </style>
</head>
<body>

    <h2>Edit Employee</h2>
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-save">Update Record</button>
            <a href="{% url 'home' %}" class="btn btn-cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
