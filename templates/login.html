<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 100px; }
        .login-box { border: 1px solid #ddd; padding: 20px; border-radius: 5px; width: 300px; }
        .btn { background-color: #007bff; color: white; padding: 8px 12px; border: none; width: 100%; margin-top: 10px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Please Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
